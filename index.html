<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NexGen</title>
  <style>
    :root {
      --paper: #f3efe6;
      --ink: #1a1814;
      --mute: #6b6560;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      min-height: 100vh;
      font: 16px/1.5 "Palatino Linotype", Palatino, "Iowan Old Style", "Songti SC", serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 56px 20px 80px;
    }
    header { text-align: center; margin-bottom: 32px; }
    .kicker {
      letter-spacing: 0.22em; font-size: 11px; text-transform: uppercase;
      color: var(--mute); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin-bottom: 10px;
    }
    h1 { font-size: 28px; font-weight: 500; margin: 0; letter-spacing: 0.02em; }
    .mouth-wrap {
      width: min(420px, 86vw);
      aspect-ratio: 1;
      border: 1px solid var(--ink);
      background: #111;
      margin-bottom: 28px;
    }
    .mouth-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .panel { width: min(420px, 86vw); text-align: center; }
    button {
      cursor: pointer; border: 1px solid var(--ink);
      padding: 14px 28px; min-width: 100%;
      letter-spacing: 0.16em; font-size: 13px; text-transform: uppercase;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: transparent; color: var(--ink);
      touch-action: none; user-select: none;
    }
    button.live { background: var(--ink); color: var(--paper); }
    button:disabled { opacity: 0.4; cursor: default; }
    .status {
      margin: 14px 0 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12px; color: var(--mute); min-height: 1.2em;
    }
    .status a { color: var(--ink); }
    audio { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="kicker" id="kicker">Laboratory Demo</div>
    <h1>NexGen</h1>
  </header>
  <div class="mouth-wrap"><img id="face" alt="mouth" /></div>
  <div class="panel">
    <button id="talk" type="button">Call</button>
    <p class="status" id="st"></p>
  </div>
  <script>
    const talk = document.getElementById("talk");
    const st = document.getElementById("st");
    const face = document.getElementById("face");
    const API = location.hostname.endsWith("github.io") ? "https://api.imcrl.com/nexgen" : "";
    const IDLE = API + "/api/idle.jpg?v=closed";
    const MAX_SEC = 10;
    let callOn = false;
    let mode = "idle";
    let mic = null;
    let playing = false;
    let utter = [];
    let voiced = false;
    let silentN = 0;
    let ring = [];
    let abortCtl = null;
    let outCtx = null;
    let playAt = 0;
    let startT = 0;
    let playSrcs = [];
    let ignoreBarge = 0;
    let sending = false;
    let outGain = null;

    face.src = IDLE;

    const kicker = document.getElementById("kicker");
    function pingNet() {
      const t0 = performance.now();
      fetch(API + "/api/health?t=" + Date.now(), { cache: "no-store" })
        .then((r) => {
          if (!r.ok) throw new Error("health");
          kicker.textContent = "Laboratory Demo  ·  " + Math.round(performance.now() - t0) + " ms";
        })
        .catch(() => {
          kicker.textContent = "Laboratory Demo  ·  —";
        });
    }
    pingNet();
    setInterval(pingNet, 2500);

    function canMic() {
      return window.isSecureContext || location.hostname === "localhost" || location.hostname === "127.0.0.1";
    }

    function idleMouth() {
      playing = false;
      delete face.dataset.i;
      face.src = IDLE;
    }

    function rms(a) {
      let s = 0;
      for (let i = 0; i < a.length; i++) s += a[i] * a[i];
      return Math.sqrt(s / Math.max(1, a.length));
    }

    function resample(input, from, to) {
      if (from === to) return input;
      const nOut = Math.max(1, Math.round(input.length * to / from));
      const out = new Float32Array(nOut);
      const ratio = (input.length - 1) / Math.max(1, nOut - 1);
      for (let i = 0; i < nOut; i++) {
        const x = i * ratio;
        const j = Math.floor(x);
        const f = x - j;
        const a = input[j];
        const b = input[Math.min(j + 1, input.length - 1)];
        out[i] = a + (b - a) * f;
      }
      return out;
    }

    function flatten(chunks) {
      const nAll = chunks.reduce((a, c) => a + c.length, 0);
      const out = new Float32Array(nAll);
      let o = 0;
      for (const c of chunks) { out.set(c, o); o += c.length; }
      return out;
    }

    function encodeWav(samples) {
      const nSamp = samples.length;
      const buf = new ArrayBuffer(44 + nSamp * 2);
      const v = new DataView(buf);
      const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      wstr(0, "RIFF"); v.setUint32(4, 36 + nSamp * 2, true); wstr(8, "WAVE");
      wstr(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
      v.setUint16(22, 1, true); v.setUint32(24, 16000, true);
      v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      wstr(36, "data"); v.setUint32(40, nSamp * 2, true);
      let o = 44;
      for (let i = 0; i < nSamp; i++, o += 2) {
        const x = Math.max(-1, Math.min(1, samples[i]));
        v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
      }
      return new Blob([buf], { type: "audio/wav" });
    }

    function pushRing(pcm16) {
      ring.push(pcm16);
      let n = ring.reduce((a, c) => a + c.length, 0);
      while (n > 16000 && ring.length > 1) n -= ring.shift().length;
    }

    function stopPlay() {
      playing = false;
      playSrcs.forEach((s) => { try { s.stop(); } catch (e) {} });
      playSrcs = [];
      playAt = 0;
      startT = 0;
      idleMouth();
    }

    function bargeIn() {
      if (abortCtl) { try { abortCtl.abort(); } catch (e) {} abortCtl = null; }
      stopPlay();
      sending = false;
      utter = ring.slice();
      voiced = true;
      silentN = 0;
      mode = "listen";
      st.textContent = "Listening…";
    }

    async function openMic() {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      const ctx = new AudioContext();
      await ctx.resume();
      const src = ctx.createMediaStreamSource(stream);
      const proc = ctx.createScriptProcessor(2048, 1, 1);
      const mute = ctx.createGain();
      mute.gain.value = 0;
      proc.onaudioprocess = (e) => {
        if (!callOn) return;
        const raw = e.inputBuffer.getChannelData(0);
        const pcm = resample(raw, ctx.sampleRate || 48000, 16000);
        const eRms = rms(pcm);
        pushRing(pcm);
        if (mode === "play" && playing && performance.now() > ignoreBarge && eRms > 0.16) {
          bargeIn();
          return;
        }
        if (mode !== "listen" || sending) return;
        if (eRms > 0.022) {
          voiced = true;
          silentN = 0;
          utter.push(pcm);
        } else if (voiced) {
          silentN += pcm.length;
          utter.push(pcm);
          if (silentN > 0.55 * 16000) flushUtter();
        }
        const nU = utter.reduce((a, c) => a + c.length, 0);
        if (nU > MAX_SEC * 16000) flushUtter();
      };
      src.connect(proc);
      proc.connect(mute);
      mute.connect(ctx.destination);
      mic = { stream, ctx, proc, mute, src };
    }

    function closeMic() {
      if (!mic) return;
      try { mic.proc.disconnect(); } catch (e) {}
      try { mic.src.disconnect(); } catch (e) {}
      try { mic.mute.disconnect(); } catch (e) {}
      mic.stream.getTracks().forEach((t) => t.stop());
      try { mic.ctx.close(); } catch (e) {}
      mic = null;
    }

    function flushUtter() {
      if (sending) return;
      const pcm = flatten(utter);
      utter = [];
      voiced = false;
      silentN = 0;
      if (pcm.length < 0.4 * 16000) return;
      sending = true;
      mode = "play";
      st.textContent = "Connecting…";
      playStream(encodeWav(pcm)).catch((e) => {
        if (e && e.name === "AbortError") return;
        st.textContent = String(e.message || e);
      }).finally(() => {
        sending = false;
        if (callOn && mode === "play" && !playing) {
          mode = "listen";
          st.textContent = "Listening… speak to talk";
        }
      });
    }

    function b64pcm(s) {
      const bin = atob(s);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return new Int16Array(u8.buffer, u8.byteOffset, u8.byteLength >> 1);
    }

    async function playStream(body) {
      abortCtl = new AbortController();
      const r = await fetch(API + "/api/talk-stream", { method: "POST", body, signal: abortCtl.signal });
      if (!r.ok || !r.body) {
        let msg = "failed";
        try { msg = (await r.json()).error || msg; } catch (e) {}
        throw new Error(msg);
      }
      if (outCtx && outCtx.state === "suspended") await outCtx.resume();
      const LIP_LEAD = 0.08;
      const PREROLL = 1.0;
      const segs = [];
      const pending = [];
      playAt = 0;
      startT = 0;
      let started = false;
      let queuedSec = 0;
      let firstElapsed = 0;
      function paint() {
        if (!playing || !startT || !outCtx) return;
        const t = Math.max(0, outCtx.currentTime - startT + LIP_LEAD);
        let seg = null;
        for (let i = 0; i < segs.length; i++) {
          const s = segs[i];
          if (t >= s.t0 && t < s.t1) { seg = s; break; }
        }
        if (!seg) {
          for (let i = segs.length - 1; i >= 0; i--) {
            if (t >= segs[i].t0) { seg = segs[i]; break; }
          }
        }
        if (seg && seg.frames && seg.frames.length) {
          const span = Math.max(1e-6, seg.t1 - seg.t0);
          const u = Math.min(0.999999, Math.max(0, (t - seg.t0) / span));
          const i = Math.min(seg.frames.length - 1, Math.floor(u * seg.frames.length));
          const key = seg.cid + ":" + i;
          if (face.dataset.i !== key) {
            face.dataset.i = key;
            face.src = seg.frames[i];
          }
        }
        if (playing) requestAnimationFrame(paint);
      }
      function scheduleBuf(buffer, cid, frames) {
        const now = outCtx.currentTime;
        const when = playAt ? Math.max(playAt, now) : now + 0.06;
        if (!playAt) {
          startT = when;
          playing = true;
          ignoreBarge = performance.now() + 1400;
          if (firstElapsed) st.textContent = firstElapsed.toFixed(1) + "s · speak to interrupt";
          requestAnimationFrame(paint);
        }
        const src = outCtx.createBufferSource();
        src.buffer = buffer;
        src.connect(outGain || outCtx.destination);
        src.start(when);
        playSrcs.push(src);
        segs.push({
          cid,
          t0: when - startT,
          t1: when - startT + buffer.duration,
          frames: frames || null,
        });
        playAt = when + buffer.duration;
      }
      function flushStart() {
        if (started || !outCtx || !pending.length) return;
        started = true;
        for (const p of pending) scheduleBuf(p.buffer, p.cid, p.frames);
        pending.length = 0;
      }
      function attachFaces(cid, urls) {
        const pend = pending.find((p) => p.cid === cid) || pending.find((p) => !p.frames);
        if (pend) pend.frames = urls;
        const seg = segs.find((s) => s.cid === cid) || segs.find((s) => !s.frames);
        if (seg) seg.frames = urls;
      }
      function makeBuffer(j) {
        const i16 = b64pcm(j.pcm);
        const f32 = new Float32Array(i16.length);
        for (let k = 0; k < i16.length; k++) f32[k] = i16[k] / 32768;
        const sr = outCtx.sampleRate || 48000;
        const pcm = resample(f32, 16000, sr);
        const b = outCtx.createBuffer(1, pcm.length, sr);
        b.getChannelData(0).set(pcm);
        return b;
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (callOn) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          let j;
          try { j = JSON.parse(line); } catch (e) { continue; }
          if (j.t === "error") throw new Error(j.error || "failed");
          if (j.t === "pcm" && outCtx) {
            if (j.first) firstElapsed = j.elapsed;
            const b = makeBuffer(j);
            if (!started) {
              pending.push({ buffer: b, cid: j.cid, frames: null });
              queuedSec += b.duration;
              if (queuedSec >= PREROLL) flushStart();
            } else {
              scheduleBuf(b, j.cid, null);
            }
          }
          if (j.t === "faces") {
            attachFaces(j.cid, j.frames.map((x) => "data:image/jpeg;base64," + x));
          }
          if (j.t === "done") flushStart();
        }
      }
      flushStart();
      if (!callOn || !outCtx) return;
      const left = Math.max(0, playAt - outCtx.currentTime);
      await new Promise((res) => setTimeout(res, left * 1000 + 40));
      stopPlay();
      if (callOn) {
        mode = "listen";
        st.textContent = "Listening… speak to talk";
      }
    }

    async function startCall() {
      outCtx = new AudioContext();
      outGain = outCtx.createGain();
      outGain.gain.value = 1.6;
      outGain.connect(outCtx.destination);
      await outCtx.resume();
      await openMic();
      callOn = true;
      mode = "listen";
      utter = [];
      voiced = false;
      silentN = 0;
      talk.classList.add("live");
      talk.textContent = "Hang up";
      st.textContent = "Listening… speak to talk";
    }

    function hangUp() {
      callOn = false;
      mode = "idle";
      if (abortCtl) { try { abortCtl.abort(); } catch (e) {} abortCtl = null; }
      stopPlay();
      if (outCtx) { try { outCtx.close(); } catch (e) {} outCtx = null; outGain = null; }
      closeMic();
      utter = [];
      ring = [];
      sending = false;
      talk.classList.remove("live");
      talk.textContent = "Call";
      st.textContent = "Tap Call to start";
    }

    talk.onclick = () => {
      if (!canMic()) return;
      if (callOn) hangUp();
      else startCall().catch((e) => { st.textContent = String(e.message || e); hangUp(); });
    };
    fetch(API + "/api/health").then((r) => r.json()).then((h) => {
      if (canMic()) {
        st.textContent = "Tap Call, then speak. You can interrupt while it talks.";
        return;
      }
      const port = h.https_port || 7861;
      const href = "https://" + location.hostname + ":" + port + "/";
      st.innerHTML = "Open <a href=\"" + href + "\">" + href + "</a> and accept the certificate";
      talk.disabled = true;
    }).catch(() => {
      st.textContent = "Cannot reach the lab server.";
    });
  </script>
</body>
</html>
